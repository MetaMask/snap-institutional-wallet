name: Publish Release

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: false
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: true
          ref: ${{ github.sha }}
      - uses: MetaMask/action-publish-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Snap
        run: yarn workspace @metamask/institutional-wallet-snap build
      - uses: actions/cache@v4
        id: restore-build
        with:
          # We must cache the `snap.manifest.json` file because it might change
          # during the release build due to secrets being injected by the CI.
          path: |
            ./packages/*/dist
            ./packages/snap/snap.manifest.json
            ./node_modules/.yarn-state.yml
          key: ${{ github.sha }}

  publish-npm-dry-run:
    runs-on: ubuntu-latest
    needs: publish-release
    steps:
      - name: Checkout and setup environment
        # action-npm-publish@v7 requires Node.js 22.14 or newer.
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: true
          persist-credentials: false
          ref: ${{ github.sha }}
          skip-install: true
          node-version: '22'
      - uses: actions/cache@v4
        id: restore-build
        with:
          # We must cache the `snap.manifest.json` file because it might change
          # during the release build due to secrets being injected by the CI.
          path: |
            ./packages/*/dist
            ./packages/snap/snap.manifest.json
            ./node_modules/.yarn-state.yml
          key: ${{ github.sha }}
      - name: Dry Run Publish
        uses: MetaMask/action-npm-publish@v7
        with:
          dry-run: true
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          subteam: S042S7RE4AE # @metamask-npm-publishers

  publish-npm:
    environment: npm-publish
    runs-on: ubuntu-latest
    needs: publish-npm-dry-run
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout and setup environment
        # action-npm-publish@v7 requires Node.js 22.14 or newer.
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: true
          persist-credentials: false
          ref: ${{ github.sha }}
          skip-install: true
          node-version: '22'
      - uses: actions/cache@v4
        id: restore-build
        with:
          # We must cache the `snap.manifest.json` file because it might change
          # during the release build due to secrets being injected by the CI.
          path: |
            ./packages/*/dist
            ./packages/snap/snap.manifest.json
            ./node_modules/.yarn-state.yml
          key: ${{ github.sha }}
      - name: Publish
        uses: MetaMask/action-npm-publish@v7
        with:
          dry-run: false
          # This `NPM_TOKEN` is only used the first time a package is published.
          # Later publishes authenticate with OIDC. Look in the repository
          # settings under "Environments" and set this token in the
          # `npm-publish` environment if a package has never been published.
          npm-token: ${{ secrets.NPM_TOKEN }}
