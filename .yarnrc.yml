# Allowlist for Git repositories that can be used as dependencies. Empty
# disallows every Git dependency.
approvedGitRepositories: []

compressionLevel: mixed

enableGlobalCache: false

# Yarn does not run dependency lifecycle scripts. The allow-scripts plugin runs
# only the packages listed under lavamoat.allowScripts in package.json.
enableScripts: false

# YN0004 is the notice that Yarn skipped a lifecycle script. allow-scripts
# decides which of those scripts run.
logFilters:
  - code: YN0004
    level: discard

nodeLinker: node-modules

# Packages must be at least 3 days old to be installed.
npmMinimalAgeGate: 4320 # 3 days (in minutes)

# These scopes are exempt from the age gate.
npmPreapprovedPackages:
  - '@metamask/*'
  - '@metamask-previews/*'
  - '@lavamoat/*'

plugins:
  - checksum: 2df479e985243a9defdf1aa9aa1911374859706229cc7d128d4fb4b25ac0e1fa7df5a49892b1a9eeb397a098ef5b741021c8da795240e4243463ef075c4549cd
    path: .yarn/plugins/@yarnpkg/plugin-allow-scripts.cjs
    spec: 'https://raw.githubusercontent.com/LavaMoat/LavaMoat/main/packages/yarn-plugin-allow-scripts/bundles/@yarnpkg/plugin-allow-scripts.js'
