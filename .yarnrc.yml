# No dependencies are installed from Git. An empty list rejects every Git
# repository, which matches the previous install (there were no Git deps).
approvedGitRepositories: []

compressionLevel: mixed

enableGlobalCache: false

# Lifecycle scripts stay enabled. This project does not use the allow-scripts
# plugin, and packages such as sharp need their install scripts.
enableScripts: true

nodeLinker: node-modules

# Yarn 4 delays newly published packages by default. Keep the previous
# behavior so a release install is not blocked on package age.
npmMinimalAgeGate: 0
