# No dependencies are installed from Git. An empty list rejects every Git
# repository, which matches the previous install (there were no Git deps).
approvedGitRepositories: []

compressionLevel: mixed

enableGlobalCache: false

# Lifecycle scripts stay enabled. This project does not use the allow-scripts
# plugin, and packages such as sharp need their install scripts.
enableScripts: true

nodeLinker: node-modules

# Configure the NPM minimal age gate to 3 days, meaning packages must be at
# least 3 days old to be installed.
npmMinimalAgeGate: 4320 # 3 days (in minutes)

# Override the minimal age gate, allowing certain packages to be installed
# regardless of their publish age.
npmPreapprovedPackages:
  - '@metamask/*'
  - '@metamask-previews/*'
  - '@lavamoat/*'
